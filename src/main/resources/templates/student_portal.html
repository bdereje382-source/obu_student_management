<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Portal</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f9; }
        .card { max-width: 550px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #004080; border-bottom: 2px solid #004080; padding-bottom: 10px; }
        p { font-size: 16px; margin: 10px 0; }
        .logout { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #dc3545; color: white; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
<div class="card">
    <h2>Student Information Portal</h2>
    <p><strong>Full Name:</strong> <span th:text="${student.fullName}"></span></p>
    <p><strong>Email:</strong> <span th:text="${student.email}"></span></p>
    <p><strong>Gender:</strong> <span th:text="${student.gender}"></span></p>
    <p><strong>Religion:</strong> <span th:text="${student.religion}"></span></p>
    <p><strong>Campus:</strong> <span th:text="${student.campus}"></span></p>
    <p><strong>Dormitory Block:</strong> <span th:text="${student.dormBlock}"></span></p>
    <p><strong>Room Number:</strong> <span th:text="${student.roomNumber}"></span></p>

    <a th:href="@{/logout}" class="logout">Logout</a>
</div>
</body>
</html>
