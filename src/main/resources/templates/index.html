 <!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Oda Bultum University</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0a4d24, #147a3d);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
            width: 420px;
        }
        .logo-badge {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #0a4d24;
            color: #ffd700;
            font-size: 26px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px auto;
            border: 3px solid #ffd700;
        }
        .box h1 {
            color: #0a4d24;
            font-size: 24px;
            margin: 10px 0;
        }
        .box p {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            padding: 14px;
            margin: 12px 0;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }
        .btn-green {
            background: #147a3d;
            color: white;
        }
        .btn-green:hover {
            background: #0a4d24;
        }
        .btn-dark {
            background: #222;
            color: white;
        }
        .btn-dark:hover {
            background: #000;
        }
    </style>
</head>
<body>
<div class="box">
    <div class="logo-badge">OBU</div>
    <h1>Oda Bultum University</h1>
    <p>Student Dormitory & Information Management System</p>
    <a href="/register" class="btn btn-green">Student Registration</a>
    <a href="/login" class="btn btn-dark">Admin Login</a>
</div>
</body>
</html>
