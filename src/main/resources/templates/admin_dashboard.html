<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - OBU</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef3f0;
            padding: 25px;
        }
        .header {
            background: #0a4d24;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header h2 {
            margin: 0;
            font-size: 20px;
        }
        .btn-logout {
            background: #dc3545;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        .table-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #147a3d;
            color: white;
        }
        tr:hover {
            background-color: #f5f9f6;
        }
        .btn-edit {
            background: #ffc107;
            color: #000;
            padding: 6px 10px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
        }
        .btn-delete {
            background: #dc3545;
            color: white;
            padding: 6px 10px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="header">
    <h2>Oda Bultum University - Admin Dashboard</h2>
    <a href="/" class="btn-logout">Logout</a>
</div>

<div class="table-container">
    <table>
        <thead>
        <tr>
            <th>Full Name</th>
            <th>Email</th>
            <th>Campus</th>
            <th>Department</th>
            <th>Year</th>
            <th>Block</th>
            <th>Room</th>
            <th>Sex</th>
            <th>Religion</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.fullName}"></td>
            <td th:text="${student.email}"></td>
            <td th:text="${student.campus}"></td>
            <td th:text="${student.department}"></td>
            <td th:text="${student.year}"></td>
            <td th:text="${student.dormBlock}"></td>
            <td th:text="${student.roomNumber}"></td>
            <td th:text="${student.sex}"></td>
            <td th:text="${student.religion}"></td>
            <td>
                <a th:href="@{/admin/edit/{id}(id=${student.id})}" class="btn-edit">Edit</a>
                <a th:href="@{/admin/delete/{id}(id=${student.id})}"
                   class="btn-delete"
                   onclick="return confirm('Are you sure you want to delete this student?');">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
