<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Student - OBU</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef3f0;
            padding: 30px 10px;
            display: flex;
            justify-content: center;
        }
        .form-box {
            background: white;
            padding: 30px 35px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 480px;
            border-top: 6px solid #ffc107;
        }
        h2 {
            text-align: center;
            color: #0a4d24;
            margin-top: 0;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-top: 12px;
            margin-bottom: 5px;
            font-size: 14px;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #147a3d;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }
        button:hover {
            background: #0a4d24;
        }
        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="form-box">
    <h2>Edit Student Information</h2>

    <form th:action="@{/admin/update/{id}(id=${student.id})}" th:object="${student}" method="post">
        <label>Full Name</label>
        <input type="text" th:field="*{fullName}" required>

        <label>Email</label>
        <input type="email" th:field="*{email}" required>

        <label>Campus</label>
        <select th:field="*{campus}" required>
            <option value="New Campus">New Campus</option>
            <option value="Old Campus">Old Campus</option>
        </select>

        <label>Department</label>
        <input type="text" th:field="*{department}" required>

        <label>Year</label>
        <input type="text" th:field="*{year}" required>

        <label>Dorm Block</label>
        <input type="text" th:field="*{dormBlock}" required>

        <label>Room Number</label>
        <input type="text" th:field="*{roomNumber}" required>

        <label>Sex</label>
        <select th:field="*{sex}" required>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>

        <label>Religion</label>
        <select th:field="*{religion}" required>
            <option value="Muslim">Muslim</option>
            <option value="Orthodox">Orthodox</option>
            <option value="Other">Other</option>
        </select>

        <button type="submit">Save Changes</button>
    </form>
    <a href="/admin" class="back">&larr; Cancel & Back to Dashboard</a>
</div>
</body>
</html>
